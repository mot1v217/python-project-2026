<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Чистый город</title>
</head>
<body>
    <h1>Сообщения о граффити</h1>
    <ul>
        {% for r in reports %}
            <li>
                <a href="/report/{{ r.id }}">{{ r.address }}</a>
                — статус <strong>{{ r.status.status_name }}</strong>
            </li>

        {% endfor %}
    </ul>
    <p><a href="/export/reports.csv">📥 Скачать CSV</a></p>
</body>
</html>
