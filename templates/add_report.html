<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить сообщение</title>
</head>
<body>
    <h1>Добавить сообщение о граффити</h1>

    <form action="/report/add" method="POST" enctype="multipart/form-data">
        
        <p>
            <label>Адрес (улица, дом):</label><br>
            <input type="text" name="address" required placeholder="Например: Ленина, 22">
        </p>

        <p>
            <label>Округ:</label><br>
            <select name="district_id" required>
                {% for d in districts %}
                    <option value="{{ d.id }}">{{ d.name }}</option>
                {% endfor %}
            </select>
        </p>

        <p>
            <label>Фото (jpg, png):</label><br>
            <input type="file" name="photo" accept=".jpg,.jpeg,.png" required>
        </p>

        <p>
            <label>Комментарий:</label><br>
            <textarea name="comment" rows="3" placeholder="Где именно находится граффити?"></textarea>
        </p>

        <button type="submit">Отправить</button>
        <a href="/">Отмена</a>
    </form>
</body>
</html>
